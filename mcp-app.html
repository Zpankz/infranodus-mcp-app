<!DOCTYPE html>
<html>
<head>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fff;--fg:#1a1a2e;--sf:#f4f4f8;--bd:#e0e0e6;--ac:#4361ee;--gp:#e63946;--mt:#888;--r:8px}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--sf:#161b22;--bd:#30363d;--ac:#7b9ef5;--gp:#ff6b6b;--mt:#8b949e}}
*{box-sizing:border-box;margin:0}
html,body{font-family:var(--mcp-font-family,system-ui,-apple-system,sans-serif);background:transparent;color:var(--fg);overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;min-height:400px}

.tabs{display:flex;border-bottom:2px solid var(--bd);padding:0 12px;flex-shrink:0}
.tab{padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--mt);transition:all .15s}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--ac);border-bottom-color:var(--ac)}
.tab .badge{font-size:10px;background:var(--ac);color:#fff;border-radius:10px;padding:1px 6px;margin-left:4px;font-weight:700}

.panel{flex:1;overflow-y:auto;padding:16px;display:none}
.panel.active{display:block}

.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat{padding:10px 14px;background:var(--sf);border-radius:var(--r);min-width:80px;text-align:center}
.stat b{font-size:22px;display:block;color:var(--ac)}
.stat small{font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:.05em}

canvas{width:100%;height:100%;display:block;cursor:grab}
canvas:active{cursor:grabbing}

.cluster{padding:12px;background:var(--sf);border-radius:var(--r);margin-bottom:8px;border-left:4px solid var(--ac);cursor:pointer;transition:transform .1s}
.cluster:hover{transform:translateX(4px)}
.cluster-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cluster-name{font-weight:600;font-size:14px}
.cluster-meta{font-size:11px;color:var(--mt)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:3px 10px;border-radius:12px;font-size:12px;background:var(--bg);border:1px solid var(--bd)}

.gap{padding:10px 14px;background:var(--sf);border-radius:var(--r);margin-bottom:6px;border-left:4px solid var(--gp);font-size:13px;display:flex;align-items:center;gap:8px}
.gap-arrow{color:var(--gp);font-weight:700;font-size:16px}

.stmt{padding:10px 14px;background:var(--sf);border-radius:var(--r);margin-bottom:6px;font-size:13px;line-height:1.6;cursor:pointer;transition:border-color .15s;border-left:3px solid transparent}
.stmt:hover{border-left-color:var(--ac)}
.stmt-meta{font-size:10px;color:var(--mt);margin-top:4px}

.advice{padding:16px;background:var(--sf);border-radius:var(--r);font-size:14px;line-height:1.8;white-space:pre-wrap}

.search-r{padding:12px;background:var(--sf);border-radius:var(--r);margin-bottom:6px}
.search-r-score{font-size:11px;color:var(--ac);font-weight:600}

.empty{text-align:center;padding:48px 16px;color:var(--mt)}
.empty b{display:block;font-size:18px;margin-bottom:8px;color:var(--fg)}

.tooltip{position:fixed;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:8px 12px;font-size:12px;pointer-events:none;z-index:99;max-width:220px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div class="tabs" id="tabs"></div>
<div id="panels"></div>
<div class="tooltip" id="tip" style="display:none"></div>

<script type="module">
import{App,applyDocumentTheme,applyHostStyleVariables}from"@modelcontextprotocol/ext-apps";

const app=new App({name:"infranodus",version:"1.0.0"});
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
let D=null,graph=null,hl=-1;

const PALETTE=["#4361ee","#e63946","#2ec4b6","#ff9f1c","#9b5de5","#00bbf9","#f15bb5","#fee440","#6a994e","#bc4749"];

// ── Tabs ──
function initTabs(names){
  const t=$("#tabs"),p=$("#panels");
  t.innerHTML="";p.innerHTML="";
  names.forEach((n,i)=>{
    const tb=document.createElement("div");
    tb.className="tab"+(i===0?" active":"");
    tb.dataset.idx=i;
    tb.innerHTML=n.label+(n.count!=null?`<span class="badge">${n.count}</span>`:"");
    tb.onclick=()=>{$$(".tab").forEach(x=>x.classList.remove("active"));tb.classList.add("active");$$(".panel").forEach(x=>x.classList.remove("active"));$$(".panel")[i].classList.add("active");if(i===0&&graph)graph.resize()};
    t.appendChild(tb);
    const pn=document.createElement("div");
    pn.className="panel"+(i===0?" active":"");
    pn.id="p-"+n.id;
    p.appendChild(pn);
  });
}

// ── Force Graph (Canvas) ──
class ForceGraph{
  constructor(container,nodes,edges,clusters){
    this.c=document.createElement("canvas");
    container.appendChild(this.c);
    this.ctx=this.c.getContext("2d");
    this.nodes=nodes.map((n,i)=>({...n,x:Math.random()*600-300,y:Math.random()*400-200,vx:0,vy:0,i}));
    this.edges=edges;
    this.clusters=clusters;
    this.zoom=1;this.ox=0;this.oy=0;
    this.drag=null;this.hover=-1;
    this.resize();
    this._bind();
    this._run();
  }
  resize(){this.c.width=this.c.parentElement.clientWidth;this.c.height=this.c.parentElement.clientHeight||400}
  _bind(){
    const c=this.c;
    c.addEventListener("mousemove",e=>{
      const r=c.getBoundingClientRect();
      const mx=(e.clientX-r.left-this.c.width/2)/this.zoom-this.ox;
      const my=(e.clientY-r.top-this.c.height/2)/this.zoom-this.oy;
      if(this.drag!==null){const n=this.nodes[this.drag];n.x=mx;n.y=my;n.vx=0;n.vy=0;return}
      let best=-1,bd=900;
      this.nodes.forEach((n,i)=>{const d=(n.x-mx)**2+(n.y-my)**2;if(d<bd){bd=d;best=i}});
      this.hover=bd<400?best:-1;
      if(this.hover>=0){
        const n=this.nodes[this.hover];
        const tip=$("#tip");
        tip.style.display="block";
        tip.style.left=(e.clientX+12)+"px";
        tip.style.top=(e.clientY-10)+"px";
        tip.innerHTML=`<b>${n.label||n.id}</b>${n.community!=null?"<br>Cluster "+n.community:""}${n.bc!=null?"<br>Centrality: "+n.bc.toFixed(3):""}`;
      }else{$("#tip").style.display="none"}
    });
    c.addEventListener("mousedown",e=>{
      if(this.hover>=0){this.drag=this.hover;c.style.cursor="grabbing"}
      else{this._panStart={x:e.clientX,y:e.clientY,ox:this.ox,oy:this.oy}}
    });
    c.addEventListener("mouseup",()=>{this.drag=null;this._panStart=null;c.style.cursor="grab"});
    c.addEventListener("mouseleave",()=>{this.drag=null;this._panStart=null;$("#tip").style.display="none"});
    c.addEventListener("wheel",e=>{e.preventDefault();this.zoom*=e.deltaY>0?.9:1.1;this.zoom=Math.max(.2,Math.min(5,this.zoom))},{passive:false});
    c.addEventListener("mousemove",e=>{
      if(this._panStart){
        this.ox=this._panStart.ox+(e.clientX-this._panStart.x)/this.zoom;
        this.oy=this._panStart.oy+(e.clientY-this._panStart.y)/this.zoom;
      }
    });
    c.addEventListener("click",e=>{
      if(this.hover>=0){
        const n=this.nodes[this.hover];
        hl=hl===n.community?-1:n.community;
        highlightCluster(hl);
      }
    });
    window.addEventListener("resize",()=>this.resize());
  }
  _run(){
    const tick=()=>{this._simulate();this._draw();requestAnimationFrame(tick)};
    tick();
  }
  _simulate(){
    const ns=this.nodes,es=this.edges,K=.008,REP=800,DAMP=.92,LEN=60;
    // Repulsion
    for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
      let dx=ns[j].x-ns[i].x,dy=ns[j].y-ns[i].y;
      let d2=dx*dx+dy*dy+1;
      let f=REP/d2;
      ns[i].vx-=dx*f;ns[i].vy-=dy*f;
      ns[j].vx+=dx*f;ns[j].vy+=dy*f;
    }
    // Attraction along edges
    es.forEach(e=>{
      const a=ns[e.si],b=ns[e.ti];
      if(!a||!b)return;
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.1;
      let f=K*(d-LEN);
      a.vx+=dx/d*f;a.vy+=dy/d*f;
      b.vx-=dx/d*f;b.vy-=dy/d*f;
    });
    // Center gravity
    ns.forEach(n=>{n.vx-=n.x*.001;n.vy-=n.y*.001});
    // Integrate
    ns.forEach(n=>{
      if(this.drag===n.i)return;
      n.vx*=DAMP;n.vy*=DAMP;
      n.x+=n.vx;n.y+=n.vy;
    });
  }
  _draw(){
    const ctx=this.ctx,W=this.c.width,H=this.c.height;
    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.translate(W/2,H/2);
    ctx.scale(this.zoom,this.zoom);
    ctx.translate(this.ox,this.oy);
    // Edges
    ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--bd").trim()||"#ccc";
    ctx.lineWidth=.5;
    ctx.globalAlpha=.4;
    this.edges.forEach(e=>{
      const a=this.nodes[e.si],b=this.nodes[e.ti];
      if(!a||!b)return;
      if(hl>=0&&a.community!==hl&&b.community!==hl){ctx.globalAlpha=.06;return}
      ctx.globalAlpha=hl>=0?.6:.3;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    });
    ctx.globalAlpha=1;
    // Nodes
    this.nodes.forEach((n,i)=>{
      const r=Math.max(3,Math.min(12,(n.bc||.01)*200));
      const col=PALETTE[n.community%PALETTE.length]||"#999";
      const dim=hl>=0&&n.community!==hl;
      ctx.globalAlpha=dim?.15:1;
      ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
      ctx.fillStyle=i===this.hover?"#fff":col;
      ctx.fill();
      if(i===this.hover){ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke()}
      // Labels for larger nodes
      if(r>5||i===this.hover){
        ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--fg").trim()||"#333";
        ctx.font=`${i===this.hover?11:9}px system-ui`;
        ctx.textAlign="center";
        ctx.fillText(n.label||"",n.x,n.y-r-3);
      }
    });
    ctx.globalAlpha=1;
    ctx.restore();
  }
}

function highlightCluster(id){
  hl=id;
  $$(".cluster").forEach(c=>{
    c.style.opacity=hl<0||parseInt(c.dataset.cid)===hl?"1":".3";
  });
}

// ── Render functions ──
function renderGraph(data){
  D=data;
  const clusters=data.topClusters||[];
  const gaps=data.gaps||[];
  const stmts=data.statements||[];
  const tabs=[
    {id:"graph",label:"Graph",count:data.nodeCount||0},
    {id:"clusters",label:"Clusters",count:clusters.length},
    {id:"gaps",label:"Gaps",count:gaps.length},
    {id:"stmts",label:"Statements",count:stmts.length},
  ];
  initTabs(tabs);

  // Stats
  const statsHtml=`<div class="stats">
    <div class="stat"><b>${data.nodeCount||0}</b><small>Nodes</small></div>
    <div class="stat"><b>${data.edgeCount||0}</b><small>Edges</small></div>
    <div class="stat"><b>${clusters.length}</b><small>Clusters</small></div>
    <div class="stat"><b>${gaps.length}</b><small>Gaps</small></div>
  </div>`;

  // Graph panel
  const gp=$("#p-graph");
  gp.innerHTML=statsHtml;
  gp.style.overflow="hidden";gp.style.padding="0";
  // Use raw graph data from server if available, otherwise reconstruct from clusters
  let nodes=[],edges=[];
  if(data.graphNodes&&data.graphNodes.length>0){
    nodes=data.graphNodes;
    edges=data.graphEdges||[];
  }else{
    // Fallback: reconstruct from cluster words
    const nmap={};let ni=0;
    clusters.forEach(c=>{
      (c.words||[]).forEach(w=>{
        if(!(w in nmap)){nmap[w]=ni;nodes.push({id:w,label:w,community:parseInt(c.id)||ni,bc:Math.random()*.05});ni++}
      });
      const ws=c.words||[];
      for(let i=0;i<ws.length;i++)for(let j=i+1;j<ws.length&&j<i+3;j++){
        if(nmap[ws[i]]!=null&&nmap[ws[j]]!=null)edges.push({si:nmap[ws[i]],ti:nmap[ws[j]]});
      }
    });
    gaps.forEach(g=>{
      const s=g.source||g[0],t=g.target||g[1];
      if(s in nmap&&t in nmap)edges.push({si:nmap[s],ti:nmap[t]});
    });
    (data.bigrams||[]).forEach(b=>{
      const parts=b.split(/\s*--?\s*|\s+/);
      if(parts.length>=2&&parts[0] in nmap&&parts[1] in nmap)
        edges.push({si:nmap[parts[0]],ti:nmap[parts[1]]});
    });
  }

  if(nodes.length>0){
    graph=new ForceGraph(gp,nodes,edges,clusters);
  }else{
    gp.innerHTML+=`<div class="empty"><b>No graph data</b>The API didn't return node/edge data for visualization.</div>`;
  }

  // Clusters panel
  $("#p-clusters").innerHTML=clusters.map((c,i)=>{
    const col=PALETTE[parseInt(c.id)%PALETTE.length]||PALETTE[i%PALETTE.length];
    return`<div class="cluster" data-cid="${c.id}" style="border-left-color:${col}" onclick="window._hlCluster(${c.id})">
      <div class="cluster-head"><span class="cluster-name" style="color:${col}">Cluster ${c.id}</span><span class="cluster-meta">${(c.words||[]).length} concepts</span></div>
      <div class="chips">${(c.words||[]).slice(0,10).map(w=>`<span class="chip" style="border-color:${col}">${w}</span>`).join("")}</div>
    </div>`;
  }).join("")||`<div class="empty"><b>No clusters</b></div>`;

  // Gaps panel
  $("#p-gaps").innerHTML=gaps.map(g=>{
    const s=g.source||g[0]||"?",t=g.target||g[1]||"?";
    return`<div class="gap"><span>${s}</span><span class="gap-arrow">⟷</span><span>${t}</span></div>`;
  }).join("")||`<div class="empty"><b>No structural gaps detected</b></div>`;

  // Statements panel
  $("#p-stmts").innerHTML=stmts.slice(0,40).map(s=>
    `<div class="stmt"><div>${(s.content||"").replace(/</g,"&lt;")}</div><div class="stmt-meta">ID ${s.id}${s.community!=null?" · Cluster "+s.community:""}</div></div>`
  ).join("")||`<div class="empty"><b>No statements</b></div>`;
}

window._hlCluster=id=>{hl=hl===id?-1:id;highlightCluster(hl)};

function renderAdvice(data){
  initTabs([{id:"advice",label:"AI "+(data.mode||"Advice")}]);
  $("#p-advice").innerHTML=`<div class="advice">${(data.advice||"").replace(/</g,"&lt;").replace(/\n/g,"<br>")}</div>`;
}

function renderSearch(data){
  const results=data.results||[];
  initTabs([{id:"search",label:"Search",count:results.length}]);
  $("#p-search").innerHTML=`<div class="stats"><div class="stat"><b>${results.length}</b><small>Results for "${(data.query||"").replace(/</g,"&lt;")}"</small></div></div>`+
    results.map((r,i)=>`<div class="search-r"><div>${(r.content||r.text||JSON.stringify(r).slice(0,200)).replace(/</g,"&lt;")}</div>${r.score!=null?`<div class="search-r-score">Similarity: ${(r.score*100).toFixed(1)}%</div>`:""}</div>`).join("")||`<div class="empty"><b>No results</b></div>`;
}

// ── MCP lifecycle ──
app.ontoolinput=()=>{
  initTabs([{id:"loading",label:"Loading"}]);
  $("#p-loading").innerHTML=`<div class="empty"><b>Analyzing with InfraNodus…</b>Building knowledge graph</div>`;
};

app.ontoolresult=result=>{
  const data=result?.structuredContent?.result;
  if(!data){initTabs([{id:"err",label:"Error"}]);$("#p-err").innerHTML=`<div class="empty"><b>No data</b></div>`;return}
  if(data.topClusters)renderGraph(data);
  else if(data.advice)renderAdvice(data);
  else if(data.results!=null)renderSearch(data);
  else{initTabs([{id:"raw",label:"Result"}]);$("#p-raw").innerHTML=`<pre style="font-size:12px;overflow:auto">${JSON.stringify(data,null,2).replace(/</g,"&lt;")}</pre>`}
};

app.onhostcontextchanged=ctx=>{applyDocumentTheme(ctx);applyHostStyleVariables(ctx)};
app.onteardown=async()=>({});
await app.connect();

// Show initial state
initTabs([{id:"welcome",label:"InfraNodus"}]);
$("#p-welcome").innerHTML=`<div class="empty"><b>InfraNodus Knowledge Graph</b>Use the analyze-text tool to visualize text as an interactive knowledge graph.<br><br>Tools available:<br>• <b>analyze-text</b> — text → knowledge graph<br>• <b>graph-ai-advice</b> — AI summary, gaps, questions<br>• <b>semantic-search</b> — find related statements</div>`;
</script>
</body>
</html>
