<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfraNodus Graph Viewer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: oklch(0.13 0.02 270);
      --bg-secondary: oklch(0.16 0.02 270);
      --bg-surface: oklch(0.19 0.015 270);
      --text-primary: oklch(0.92 0.01 270);
      --text-secondary: oklch(0.62 0.02 270);
      --text-muted: oklch(0.45 0.02 270);
      --accent: oklch(0.63 0.24 275);
      --accent-dim: oklch(0.63 0.24 275 / 0.15);
      --border: oklch(1 0 0 / 0.06);
      --radius: 8px;
      --font-sans: var(--font-sans, 'Inter', -apple-system, system-ui, sans-serif);
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

      /* Community palette (10 colors) */
      --c0: oklch(0.63 0.24 275);  /* indigo */
      --c1: oklch(0.65 0.28 350);  /* pink */
      --c2: oklch(0.78 0.18 80);   /* amber */
      --c3: oklch(0.72 0.19 160);  /* emerald */
      --c4: oklch(0.72 0.14 210);  /* cyan */
      --c5: oklch(0.63 0.26 300);  /* violet */
      --c6: oklch(0.63 0.24 25);   /* red */
      --c7: oklch(0.76 0.18 130);  /* lime */
      --c8: oklch(0.68 0.21 50);   /* orange */
      --c9: oklch(0.72 0.15 180);  /* teal */
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-background-primary, var(--bg-primary));
      color: var(--color-text-primary, var(--text-primary));
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #app {
      display: grid;
      grid-template-columns: 1fr 280px;
      grid-template-rows: 44px 1fr;
      height: 100vh;
      gap: 0;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: var(--color-background-secondary, var(--bg-secondary));
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    header .logo {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    header .logo svg { width: 12px; height: 12px; }

    header h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    header .stats {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--color-text-secondary, var(--text-secondary));
      margin-left: auto;
    }

    #graph-container {
      position: relative;
      overflow: hidden;
      background: var(--color-background-primary, var(--bg-primary));
    }

    /* Radial vignette overlay */
    #graph-container::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, var(--bg-primary) 100%);
      opacity: 0.4;
    }

    #sigma-canvas {
      width: 100%;
      height: 100%;
    }

    aside {
      background: var(--color-background-secondary, var(--bg-secondary));
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
      font-size: 13px;
    }

    aside::-webkit-scrollbar { width: 4px; }
    aside::-webkit-scrollbar-track { background: transparent; }
    aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    aside h2 {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted, var(--text-muted));
      margin-bottom: 8px;
      margin-top: 16px;
    }

    aside h2:first-child { margin-top: 0; }

    .cluster-list { list-style: none; margin-bottom: 4px; }

    .cluster-list li {
      padding: 5px 8px;
      border-radius: 4px;
      margin-bottom: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s;
      font-size: 12px;
    }

    .cluster-list li:hover { background: var(--accent-dim); }
    .cluster-list li.active { background: var(--accent-dim); }

    .cluster-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }

    .cluster-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cluster-count {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--color-text-muted, var(--text-muted));
    }

    .gap-list { list-style: none; margin-bottom: 4px; }

    .gap-list li {
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 4px;
      background: var(--color-background-surface, var(--bg-surface));
      font-size: 11px;
      line-height: 1.4;
    }

    .gap-arrow {
      color: var(--accent);
      margin: 0 4px;
      font-weight: 600;
    }

    /* Stats grid in sidebar */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 4px;
    }

    .stat-card {
      background: var(--bg-surface);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--accent);
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Loading state */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
    }

    .loading-state .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-state p {
      font-size: 13px;
      color: var(--color-text-secondary, var(--text-secondary));
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 12px;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.12s;
      max-width: 240px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px oklch(0 0 0 / 0.4);
    }

    .tooltip.visible { opacity: 1; }
    .tooltip .node-name { font-weight: 600; margin-bottom: 4px; }
    .tooltip .node-stats {
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
    }

    /* Welcome state */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      text-align: center;
      padding: 32px;
    }

    .welcome h2 { font-size: 18px; font-weight: 600; }
    .welcome p { font-size: 13px; color: var(--text-secondary); max-width: 360px; line-height: 1.6; }

    /* Responsive: hide sidebar on narrow */
    @media (max-width: 600px) {
      #app { grid-template-columns: 1fr; }
      aside { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
          <circle cx="12" cy="12" r="3"/>
          <circle cx="5" cy="6" r="2"/>
          <circle cx="19" cy="6" r="2"/>
          <circle cx="5" cy="18" r="2"/>
          <circle cx="19" cy="18" r="2"/>
          <line x1="9.5" y1="10.5" x2="6.5" y2="7.5"/>
          <line x1="14.5" y1="10.5" x2="17.5" y2="7.5"/>
          <line x1="9.5" y1="13.5" x2="6.5" y2="16.5"/>
          <line x1="14.5" y1="13.5" x2="17.5" y2="16.5"/>
        </svg>
      </div>
      <h1 id="graph-title">InfraNodus</h1>
      <span class="stats" id="graph-stats"></span>
    </header>
    <div id="graph-container">
      <div class="welcome" id="welcome">
        <h2>🌐 Knowledge Graph Viewer</h2>
        <p>Use the <strong>generate_knowledge_graph</strong> or <strong>get_graph</strong> tool to visualize a knowledge graph here.</p>
      </div>
      <div class="loading-state" id="loading" style="display:none">
        <div class="spinner"></div>
        <p>Rendering graph…</p>
      </div>
      <div id="sigma-canvas"></div>
    </div>
    <aside id="sidebar">
      <h2>Overview</h2>
      <div class="stats-grid" id="stats-grid"></div>
      <h2>Topic Clusters</h2>
      <ul class="cluster-list" id="cluster-list"></ul>
      <h2>Structural Gaps</h2>
      <ul class="gap-list" id="gap-list"></ul>
    </aside>
  </div>
  <div class="tooltip" id="tooltip">
    <div class="node-name"></div>
    <div class="node-stats"></div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
