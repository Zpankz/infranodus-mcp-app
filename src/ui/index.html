<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfraNodus Graph Viewer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* MCP host tokens with fallbacks — apps/2026-01-26 spec */
      --host-bg:       var(--color-background-primary,   oklch(0.135 0.006 250));
      --host-bg-2:     var(--color-background-secondary, oklch(0.165 0.006 250));
      --host-bg-3:     var(--color-background-tertiary,  oklch(0.195 0.006 250));
      --host-fg:       var(--color-text-primary,         oklch(0.965 0.003 250));
      --host-fg-2:     var(--color-text-secondary,       oklch(0.74  0.005 250));
      --host-fg-3:     var(--color-text-tertiary,        oklch(0.56  0.006 250));
      --host-border:   var(--color-border-primary,       oklch(0.28  0.006 250));
      --host-border-2: var(--color-border-secondary,     oklch(0.235 0.006 250));

      --font-ui:   var(--font-sans, 'Inter', -apple-system, system-ui, sans-serif);
      --font-mono: var(--font-mono, 'JetBrains Mono', 'SF Mono', monospace);

      /* Brand accent — InfraNodus signal orange */
      --in-accent:      oklch(0.74 0.155 52);
      --in-accent-soft: oklch(0.74 0.155 52 / 0.12);
      --in-accent-line: oklch(0.74 0.155 52 / 0.32);

      /* Cluster palette — matched chroma/lightness */
      --c-orange:  oklch(0.74 0.155 52);
      --c-cyan:    oklch(0.74 0.13  205);
      --c-violet:  oklch(0.74 0.14  290);
      --c-lime:    oklch(0.80 0.14  140);
      --c-magenta: oklch(0.74 0.16  340);
      --c-blue:    oklch(0.74 0.13  240);

      /* Lines & radii */
      --line:   1px solid var(--host-border);
      --line-2: 1px solid var(--host-border-2);
      --r-xs: 2px; --r-sm: 4px; --r-md: 6px; --r-lg: 10px;
    }

    body {
      font-family: var(--font-ui);
      background: var(--host-bg);
      color: var(--host-fg);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #app {
      display: grid;
      grid-template-columns: 1fr 280px;
      grid-template-rows: 44px 1fr;
      height: 100vh;
      gap: 0;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: var(--host-bg-2);
      border-bottom: 1px solid var(--host-border);
      gap: 12px;
    }

    header .logo {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: var(--in-accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    header .logo svg { width: 12px; height: 12px; }

    header h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    header .stats {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--host-fg-2);
      margin-left: auto;
    }

    #graph-container {
      position: relative;
      overflow: hidden;
      background: var(--host-bg);
    }

    /* Radial vignette overlay */
    #graph-container::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, var(--host-bg) 100%);
      opacity: 0.4;
    }

    #sigma-canvas {
      width: 100%;
      height: 100%;
    }

    aside {
      background: var(--host-bg-2);
      border-left: 1px solid var(--host-border);
      overflow-y: auto;
      padding: 16px;
      font-size: 13px;
    }

    aside::-webkit-scrollbar { width: 4px; }
    aside::-webkit-scrollbar-track { background: transparent; }
    aside::-webkit-scrollbar-thumb { background: var(--host-border); border-radius: 2px; }

    aside h2 {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--host-fg-3);
      margin-bottom: 8px;
      margin-top: 16px;
    }

    aside h2:first-child { margin-top: 0; }

    .cluster-list { list-style: none; margin-bottom: 4px; }

    .cluster-list li {
      padding: 5px 8px;
      border-radius: 4px;
      margin-bottom: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s;
      font-size: 12px;
    }

    .cluster-list li:hover { background: var(--in-accent-soft); }
    .cluster-list li.active { background: var(--in-accent-soft); }

    .cluster-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }

    .cluster-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cluster-count {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--host-fg-3);
    }

    .gap-list { list-style: none; margin-bottom: 4px; }

    .gap-list li {
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 4px;
      background: var(--host-bg-3);
      font-size: 11px;
      line-height: 1.4;
    }

    .gap-arrow {
      color: var(--in-accent);
      margin: 0 4px;
      font-weight: 600;
    }

    /* Stats grid in sidebar */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 4px;
    }

    .stat-card {
      background: var(--host-bg-3);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--in-accent);
    }

    .stat-label {
      font-size: 10px;
      color: var(--host-fg-3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Loading state */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
    }

    .loading-state .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--host-border);
      border-top-color: var(--in-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-state p {
      font-size: 13px;
      color: var(--host-fg-2);
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      background: var(--host-bg-3);
      border: 1px solid var(--host-border);
      border-radius: var(--r-md);
      padding: 10px 14px;
      font-size: 12px;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.12s;
      max-width: 240px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px oklch(0 0 0 / 0.4);
    }

    .tooltip.visible { opacity: 1; }
    .tooltip .node-name { font-weight: 600; margin-bottom: 4px; }
    .tooltip .node-stats {
      color: var(--host-fg-2);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
    }

    /* Welcome state */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      text-align: center;
      padding: 32px;
    }

    .welcome h2 { font-size: 18px; font-weight: 600; }
    .welcome p { font-size: 13px; color: var(--host-fg-2); max-width: 360px; line-height: 1.6; }

    /* Responsive: hide sidebar on narrow */
    @media (max-width: 600px) {
      #app { grid-template-columns: 1fr; }
      aside { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
          <circle cx="12" cy="12" r="3"/>
          <circle cx="5" cy="6" r="2"/>
          <circle cx="19" cy="6" r="2"/>
          <circle cx="5" cy="18" r="2"/>
          <circle cx="19" cy="18" r="2"/>
          <line x1="9.5" y1="10.5" x2="6.5" y2="7.5"/>
          <line x1="14.5" y1="10.5" x2="17.5" y2="7.5"/>
          <line x1="9.5" y1="13.5" x2="6.5" y2="16.5"/>
          <line x1="14.5" y1="13.5" x2="17.5" y2="16.5"/>
        </svg>
      </div>
      <h1 id="graph-title">InfraNodus</h1>
      <span class="stats" id="graph-stats"></span>
    </header>
    <div id="graph-container">
      <div class="welcome" id="welcome">
        <h2>🌐 Knowledge Graph Viewer</h2>
        <p>Use the <strong>generate_knowledge_graph</strong> or <strong>get_graph</strong> tool to visualize a knowledge graph here.</p>
      </div>
      <div class="loading-state" id="loading" style="display:none">
        <div class="spinner"></div>
        <p>Rendering graph…</p>
      </div>
      <div id="sigma-canvas"></div>
    </div>
    <aside id="sidebar">
      <h2>Overview</h2>
      <div class="stats-grid" id="stats-grid"></div>
      <h2>Topic Clusters</h2>
      <ul class="cluster-list" id="cluster-list"></ul>
      <h2>Structural Gaps</h2>
      <ul class="gap-list" id="gap-list"></ul>
    </aside>
  </div>
  <div class="tooltip" id="tooltip">
    <div class="node-name"></div>
    <div class="node-stats"></div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
